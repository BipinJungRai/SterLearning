image: python:3.12.0

stages:
  - test
  - linting
  - deploy

merging:
  stage: test
  only: [ merge_requests ]
  script:
     - "[[ \"$CI_MERGE_REQUEST_TARGET_BRANCH_NAME\" =~ ^release$ ]] && [[ ! \"$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME\" =~ ^trunk$ ]] && echo 'Only trunk can be merged to release' && exit 1"
     - exit 0

django-tests:
  stage: test
  before_script:
    - python3 -m pip install -r requirements.txt
  script:
    - python3 manage.py test

pylint:
  stage: linting
  before_script:
    - python3 -m pip install -r requirements.txt
    - python3 -m pip install pylint
    - python3 -m pip install pylint-django
  script:
    - pylint --fail-under=7.5 --load-plugins=pylint_django --ignore=migrations --disable=C0116,C0115,C0114 SterLearning app_admin app_leaderboard app_pages app_quiz app_tools app_user

pages:
  stage: deploy
  script:
      - apk add python3 py3-yaml py3-mako
      - python3 /shared/com2027_site.py
  artifacts:
    paths:
      - public
  only:
    - release

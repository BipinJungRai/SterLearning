project_name: SterLearning (working title)

project_description: |  
  
  Gamified learning tool about budget and finance for young people, navigating their first job. In-game rewards and competition are used to motivate users.
  Users will earn an in-game currency which they can use to customize an avatar.
  Quiz topics will cover bank accounts, pensions, taxes, types of loans, and budgeting skills.


